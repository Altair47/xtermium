# Builds the macOS app on request (Actions tab, `gh workflow run build.yml --ref <branch>`), the
# one platform no one can build locally (the maintainer's PC is Windows), to try a change that may
# break it before it reaches main. Nothing builds on pull requests or commits: only nightly builds (nightly.yml) and releases build by
# themselves (release.yml). It publishes nothing; the .dmg is kept 7 days as the run's artifact. Windows and Linux build in release.yml. A run
# takes about 80 minutes: two release builds of the app and of the RDP helper, one per CPU.
name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # Developer ID signing and notarization, when the repository has the Apple secrets.
      - run: sh scripts/apple-env.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      # The same build release.yml makes for macOS: both architectures in one app.
      - run: npx tauri build --target universal-apple-darwin

      # Both programs carry both CPUs, the app's signature holds, and xtermium starts on this Mac
      # (its help, which needs no window), natively and, where Rosetta is there, as Intel code.
      - run: |
          app=target/universal-apple-darwin/release/bundle/macos/xtermium.app
          for b in xtermium xtermium-rdp; do lipo "$app/Contents/MacOS/$b" -verify_arch arm64 x86_64; done
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/xtermium" help 2>&1 | grep -q "Drive the running xtermium"
          # Signed with the Developer ID: Gatekeeper takes it, and the notarization ticket is stapled on.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$app/Contents/MacOS/xtermium" help 2>&1 | grep -q "Drive the running xtermium"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: xtermium-macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error
