# Pull requests build the macOS app, the one platform no one can build locally (the maintainer's
# PC is Windows), so a change that breaks it shows before it reaches main. It publishes nothing;
# the .dmg is kept 7 days as the run's artifact. Windows and Linux build in release.yml. A run
# takes about 80 minutes: two release builds of the app and of the RDP helper, one per CPU.
name: build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # The same build release.yml makes for macOS: both architectures in one app.
      - run: npx tauri build --target universal-apple-darwin

      # Both programs carry both CPUs, the app's signature holds, and xtermium starts on this Mac
      # (its help, which needs no window), natively and, where Rosetta is there, as Intel code.
      - run: |
          app=target/universal-apple-darwin/release/bundle/macos/xtermium.app
          for b in xtermium xtermium-rdp; do lipo "$app/Contents/MacOS/$b" -verify_arch arm64 x86_64; done
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/xtermium" help 2>&1 | grep -q "Drive the running xtermium"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$app/Contents/MacOS/xtermium" help 2>&1 | grep -q "Drive the running xtermium"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: xtermium-macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error
