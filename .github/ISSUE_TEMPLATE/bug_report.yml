name: Bug report
description: Something in xtermium doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please check the [open issues](https://github.com/xtermium/xtermium/issues) first, and update to the [latest release](https://github.com/xtermium/xtermium/releases/latest) if you can: the problem may be fixed already.
        A security problem goes [privately](https://github.com/xtermium/xtermium/security/advisories/new), never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including any error message, copied as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a fresh start, the shortest way to make it happen.
      placeholder: |
        1. Open an SSH session to …
        2. Split the tab …
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SSH or SFTP
        - RDP
        - VNC
        - Telnet, serial or local shell
        - WinRM
        - BMC console
        - Website tab
        - Tunnels
        - Sessions, folders, import or export
        - Lock, encryption or recovery passphrase
        - Sync or account (Pro)
        - Terminal Co-op (Pro)
        - MCP server, CLI or AI agent tabs
        - Terminal rendering, fonts or themes
        - Install, update or start-up
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: xtermium version and build
      description: Settings › About, for example "0.7.0 build 123 (release)".
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS (Apple silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version, and on Linux the distribution and desktop
      placeholder: "Windows 11 24H2 · Ubuntu 24.04, GNOME on Wayland · macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - install.ps1 (Windows script)
        - Scoop
        - .exe or .msi from the release
        - Portable .zip
        - install.sh (Linux or macOS script)
        - .deb
        - .rpm
        - AppImage
        - .dmg
        - Built from source
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Troubleshooting bundle
      description: |
        Settings › Troubleshoot › Create bundle opens a folder of plain-text files about your installation. It holds no passwords, tokens, names or addresses, but read it before you share it. Zip the folder and drag the .zip here.
        If xtermium doesn't start, say so instead.
      placeholder: Drag bundle.zip here.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Drag images or a short video here. Hide host names, addresses and anything private first.
  - type: textarea
    id: logs
    attributes:
      label: Logs or other output
      description: Paste text output here; it is formatted as code.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: The remote side (SSH server, RDP host, BMC model), a proxy or VPN, when it started, whether an earlier version worked.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the open issues and this isn't one of them.
          required: true
        - label: The screenshots, logs and bundle show no passwords, keys or private addresses.
          required: true
